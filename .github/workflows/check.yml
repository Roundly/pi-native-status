name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / typecheck, tests, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check Python 3
        run: python3 --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and render tests
        run: npm test

      - name: Font tool tests
        run: npm run test:fonts

      - name: Offline PTY smoke test
        run: npm run test:smoke
